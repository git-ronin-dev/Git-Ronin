name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  packaging:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y appstream
      # No homepage until the project has a public one.
      - run: >
          appstreamcli validate --no-net --override=url-homepage-missing=info
          packaging/linux/com.gitronin.desktop.metainfo.xml

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # tauri::generate_context! requires the built frontend to exist.
      - run: npm ci && npm run build -w ui
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Failures are also reported as annotations, readable without logs.
      - name: cargo test --workspace
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast 2>&1 | tee test.log && exit 0
          awk '{sub(/\r$/, "")}
               /^---- .* stdout ----$/ {if (m) print m; m=$0; next}
               /^failures:$/ || /^test result:/ {if (m) print m; m=""; next}
               m != "" {m = m "%0A" $0}
               END {if (m) print m}' test.log > failures.txt
          [ -s failures.txt ] || tail -n 40 test.log | awk '{printf "%s%%0A", $0}' > failures.txt
          cut -c1-4000 failures.txt | sed 's/^/::error::/'
          exit 1
      - name: Generated TypeScript bindings are committed
        run: git diff --exit-code ui/src/bindings
