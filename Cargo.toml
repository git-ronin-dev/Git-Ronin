[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-or-later"

[workspace.dependencies]
ronin-config = { path = "crates/ronin-config" }
ronin-git = { path = "crates/ronin-git" }
ronin-hosting = { path = "crates/ronin-hosting" }
gix = "0.88"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = "12"
tempfile = "3"
toml = "1"
